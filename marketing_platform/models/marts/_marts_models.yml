version: 2

models:
  - name: dim_marketing_campaigns
    description: >
      One row per campaign per platform. Use it to look up campaign names.
      Grain: one row per platform and campaign_id.
    columns:
      - name: campaign_key
        description: "Surrogate key made from platform + campaign_id."
        data_tests: [unique, not_null]
      - name: platform
        data_tests:
          - accepted_values:
              arguments:
                values: ['facebook', 'snapchat']
      - name: campaign_id
        data_tests: [not_null]
      - name: campaign_name
        description: "Campaign name as written in the advertising platform."

  - name: fct_marketing_ad_performance_daily
    description: >
      Most detailed performance table. Grain: one row per platform, ad, day and country
      (country is NULL for Facebook). Built incrementally by month so only recent months are reprocessed.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [platform, ad_id, ad_date, country_code]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "clicks <= impressions"
    columns:
      - name: ad_performance_key
        description: "Surrogate key of platform + ad_id + ad_date + country_code."
        data_tests: [unique, not_null]
      - name: campaign_key
        description: "Joins to dim_marketing_campaigns."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_marketing_campaigns')
                field: campaign_key
      - name: platform
        data_tests:
          - accepted_values:
              arguments:
                values: ['facebook', 'snapchat']
      - name: ad_date
        data_tests: [not_null]
      - name: currency_code
        description: "Currency of the spend column."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['EUR', 'USD']
      - name: spend
        description: "Spend in the account's own currency (currency_code). Do not add across currencies."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: spend_eur
        description: "{{ doc('spend_eur') }}"
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: impressions
        description: "Times the ad was shown. Missing values are treated as 0."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: clicks
        description: "Clicks. Missing values are treated as 0 (see is_clicks_imputed)."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: is_clicks_imputed
        description: "TRUE when the source had no click value and 0 was filled in."

  - name: fct_marketing_spend
    description: >
      Main table for analysts, BI tools and AI agents.
      Grain: one row per platform, campaign, day and currency.
      Ratios are calculated from summed numbers, never averaged.
    columns:
      - name: campaign_day_key
        description: "Surrogate key of platform + campaign_id + ad_date + currency_code."
        data_tests: [unique, not_null]
      - name: campaign_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_marketing_campaigns')
                field: campaign_key
      - name: platform
        description: "facebook or snapchat."
        data_tests:
          - accepted_values:
              arguments:
                values: ['facebook', 'snapchat']
      - name: campaign_name
        description: "Campaign name from dim_marketing_campaigns."
      - name: ad_date
        data_tests: [not_null]
      - name: currency_code
        description: "Currency of spend, cpc and cpm."
      - name: spend
        description: "Total spend in currency_code."
      - name: spend_eur
        description: "{{ doc('spend_eur') }}"
        data_tests: [not_null]
      - name: impressions
        description: "Total impressions."
      - name: clicks
        description: "Total clicks."
      - name: ctr
        description: "{{ doc('ctr') }}"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: cpc
        description: "{{ doc('cpc') }}"
      - name: cpm
        description: "{{ doc('cpm') }}"