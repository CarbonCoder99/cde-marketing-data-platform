name: Deploy to production

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing_platform
    env:
      DBT_TARGET: production
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DBX_ID_APPLICATION_ID: ${{ secrets.DBX_ID_APPLICATION_ID }}
      DBX_SECRET: ${{ secrets.DBX_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r ../requirements.txt

      - run: dbt deps
      - run: dbt debug

      - name: Build and test production
        run: dbt build

      - name: Generate dbt docs
        if: always()
        run: dbt docs generate --static

      - name: Generate Elementary report
        if: always()
        run: |
          edr report --profiles-dir . --profile-target production --open-browser false || echo "Elementary report generation skipped due to missing invocation history."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-docs
          path: marketing_platform/target/static_index.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elementary-report
          path: marketing_platform/edr_target/elementary_report.html