name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  dbt-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing_platform
    env:
      DBT_TARGET: ci
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DBX_ID_APPLICATION_ID: ${{ secrets.DBX_ID_APPLICATION_ID }}
      DBX_SECRET: ${{ secrets.DBX_SECRET }}
      BRANCH_NAME: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r ../requirements.txt

      - name: Name this pull request's schema
        run: |
          SCHEMA="PR_$(echo "$BRANCH_NAME" | sed 's/[^A-Za-z0-9]/_/g' | tr '[:lower:]' '[:upper:]')"
          echo "DBT_SCHEMA=$SCHEMA" >> "$GITHUB_ENV"

      - name: Install dbt packages
        run: dbt deps

      - name: Check the connection
        run: dbt debug

      - name: Build and test everything
        run: dbt build --fail-fast

      - name: Drop the temporary schema
        if: always()
        run: dbt run-operation drop_pr_schema